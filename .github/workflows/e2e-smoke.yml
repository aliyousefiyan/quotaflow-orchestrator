name: QuotaFlow one-time end-to-end smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger safe public smoke worker
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/quotaflow-worker.yml/dispatches" \
            -f ref=main \
            -f "inputs[job_id]=e2e-${RUN_ID}" \
            -f "inputs[profile]=smoke"
          echo "Dispatched QuotaFlow public smoke worker for e2e-${RUN_ID}"
